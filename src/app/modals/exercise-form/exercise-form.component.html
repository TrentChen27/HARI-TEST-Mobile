<ion-header>
  <ion-toolbar color="primary">
    <ion-title>{{ isEditMode ? 'Edit' : 'Report' }} Exercise</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()">
        <ion-icon name="close" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="compact-form">
  <form [formGroup]="exerciseForm" (ngSubmit)="onSubmit()">
    <ion-list [inset]="true">

      <!-- Exercise Type & Duration on same line -->
      <ion-item lines="none" class="exercise-row">
        <ion-grid class="ion-no-padding">
          <ion-row>
            <ion-col size="7">
              <ion-input
                label="Exercise Type"
                labelPlacement="floating"
                formControlName="exerciseType"
                [required]="true"
                placeholder="Running, Cycling..."
              ></ion-input>
            </ion-col>
            <ion-col size="5">
              <ion-input
                label="Duration"
                labelPlacement="floating"
                formControlName="exerciseDuration"
                [required]="true"
                placeholder="30 min"
              ></ion-input>
            </ion-col>
          </ion-row>
        </ion-grid>
      </ion-item>

      <!-- Date & Time with Dropdown Picker -->
      <ion-item [button]="true" id="open-datetime-picker" [detail]="false" class="datetime-item">
        <ion-icon name="calendar-outline" slot="start" color="primary"></ion-icon>
        <ion-label>
          <h3>Date & Time</h3>
          <p class="datetime-value">{{ exerciseForm.get('dateTime')?.value | date:'MMM d, y, h:mm a' }}</p>
        </ion-label>
      </ion-item>

      <ion-popover trigger="open-datetime-picker" [dismissOnSelect]="false">
        <ng-template>
          <ion-datetime
            [value]="exerciseForm.get('dateTime')?.value"
            [max]="maxDate"
            (ionChange)="onDateTimeChange($event)"
            presentation="date-time"
            [showDefaultButtons]="true"
            (ionCancel)="dateTimePopover.dismiss()"
          ></ion-datetime>
        </ng-template>
      </ion-popover>

      <!-- Validation Error Message -->
      <ion-item lines="none" *ngIf="exerciseForm.get('dateTime')?.hasError('futureDate') && exerciseForm.get('dateTime')?.touched" class="error-item">
        <ion-label color="danger" class="error-message">
          <ion-icon name="alert-circle-outline"></ion-icon>
          Future dates are not allowed
        </ion-label>
      </ion-item>

      <!-- Location Selector -->
      <ion-item lines="none" class="location-header">
        <ion-label>
          <h3>Location</h3>
        </ion-label>
      </ion-item>

      <ion-item lines="none" class="location-segment">
        <ion-segment formControlName="exerciseLocation" value="inside">
          <ion-segment-button value="inside">
            <ion-icon name="home"></ion-icon>
            <ion-label>Inside</ion-label>
          </ion-segment-button>
          <ion-segment-button value="outside">
            <ion-icon name="sunny"></ion-icon>
            <ion-label>Outside</ion-label>
          </ion-segment-button>
        </ion-segment>
      </ion-item>

    </ion-list>

    <!-- Action Buttons at Bottom -->
    <div class="form-actions ion-padding">
      <ion-button expand="block" fill="outline" color="medium" (click)="dismiss()">
        Cancel
      </ion-button>
      <ion-button expand="block" color="success" (click)="onSubmit()" [disabled]="isSubmitting || exerciseForm.invalid">
        <ion-icon name="checkmark" slot="start"></ion-icon>
        {{ isSubmitting ? 'Saving...' : 'Save' }}
      </ion-button>
    </div>
  </form>
</ion-content>
